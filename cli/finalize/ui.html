<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finalize</title>
<style>
:root { --bg:#ecebe6; --panel:#f7f6f2; --ink:#22282c; --muted:#6a6e6b; --rule:#d6d3ca; --accent:#c4442f; --mono:ui-monospace,Menlo,monospace; color-scheme:light }
* { box-sizing:border-box } [hidden] { display:none !important }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif }
header { display:flex; align-items:baseline; gap:16px; padding:14px 20px; border-bottom:1px solid var(--rule) }
h1 { margin:0; font-size:20px; letter-spacing:-.01em } h2 { margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted) }
.app { display:grid; grid-template-columns:200px minmax(0,1fr) 340px; min-height:calc(100vh - 54px) }
.list { border-right:1px solid var(--rule); padding:12px; display:grid; gap:10px; align-content:start; overflow:auto; max-height:calc(100vh - 54px) }
.piece { display:grid; gap:4px; padding:6px; border:2px solid transparent; border-radius:6px; background:var(--panel); cursor:pointer; text-align:left; font:inherit; color:inherit }
.piece.on { border-color:var(--accent) } .piece svg { width:100%; height:auto; display:block }
.piece small { color:var(--muted); font:11px var(--mono) }
.piece label { display:flex; gap:6px; align-items:center; font-size:12px }
.stage { padding:16px; display:grid; place-items:start center; overflow:auto; max-height:calc(100vh - 54px) }
.sheet { width:min(100%, 620px); box-shadow:0 1px 0 var(--rule),0 10px 30px rgb(0 0 0/.12) }
.sheet svg { width:100%; height:auto; display:block }
.side { border-left:1px solid var(--rule); padding:14px; display:grid; gap:18px; align-content:start; overflow:auto; max-height:calc(100vh - 54px); background:var(--panel) }
.palettes { display:grid; gap:6px }
.pal { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; align-items:center; padding:7px 8px; border:1px solid var(--rule); border-radius:6px; background:#fff; cursor:pointer; text-align:left; font:inherit; color:inherit }
.pal.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) }
.sw { display:flex; border-radius:3px; overflow:hidden; border:1px solid var(--rule) } .sw i { width:14px; height:18px }
.pal b { font-size:13px } .pal span { grid-column:2; color:var(--muted); font-size:11.5px }
.layers { display:grid; gap:6px }
.layer { display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:center; font-size:13px }
.layer input[type=color] { width:28px; height:24px; padding:0; border:1px solid var(--rule); border-radius:4px; background:none }
.layer .k { font:11px var(--mono); color:var(--muted) }
.opts { display:grid; gap:8px; font-size:13px }
.opts label { display:flex; justify-content:space-between; gap:10px; align-items:center }
.opts input[type=number] { width:76px; font:inherit; padding:3px 5px }
select { font:inherit }
.actions { display:grid; gap:8px }
button.go { font:600 14px inherit; padding:10px; border-radius:7px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer }
button.go.alt { background:#fff; color:var(--ink) }
button:disabled { opacity:.5; cursor:default }
.status { font:12px var(--mono); color:var(--muted); min-height:1.4em }
.results { display:grid; gap:12px }
.result { border:1px solid var(--rule); border-radius:6px; background:#fff; padding:10px; display:grid; gap:6px }
.result table { border-collapse:collapse; width:100%; font:11.5px var(--mono); font-variant-numeric:tabular-nums }
.result td,.result th { padding:2px 4px; text-align:right; border-bottom:1px solid var(--rule) } .result td:first-child,.result th:first-child { text-align:left }
.result a { color:var(--accent) } .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:-1px; border:1px solid var(--rule) }
@media (max-width: 980px) { .app { grid-template-columns:1fr } .list { grid-auto-flow:column; grid-auto-columns:120px; max-height:none; border-right:0; border-bottom:1px solid var(--rule) } .side,.stage { max-height:none } }
</style>
</head>
<body>
<header><h1 id="title">Finalize</h1><span class="status" id="hdr"></span></header>
<div class="app">
  <nav class="list" id="list"></nav>
  <main class="stage"><div class="sheet" id="sheet"></div></main>
  <aside class="side">
    <section><h2>Palette</h2><div class="palettes" id="palettes"></div></section>
    <section><h2>Inks for this piece</h2><div class="layers" id="layers"></div>
      <div class="layer" style="margin-top:8px"><input type="color" id="paper"><span>Paper</span><span class="k" id="paperHex"></span></div></section>
    <section class="opts"><h2>Placement and vpype</h2>
      <label>Center artwork <select id="center"><option value="vertical">vertically</option><option value="both">both axes</option><option value="none">as drawn</option></select></label>
      <label>Merge same-color pens <input type="checkbox" id="merge"></label>
      <label>linemerge tolerance (mm) <input type="number" id="mergeTol" step="0.05" min="0"></label>
      <label>linesimplify tolerance (mm) <input type="number" id="simpTol" step="0.01" min="0"></label>
      <label>Drop paths shorter than (mm) <input type="number" id="minLen" step="0.1" min="0"></label>
    </section>
    <section class="actions">
      <button class="go" id="one">Finalize this piece</button>
      <button class="go alt" id="all">Finalize checked pieces</button>
      <div class="status" id="status"></div>
    </section>
    <section class="results" id="results"></section>
  </aside>
</div>
<script>
let S = null, cur = null, palette = null; const svgs = {}, checked = new Set();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function boot() {
  S = await (await fetch('/api/stack')).json();
  $('title').textContent = S.title; document.title = S.title;
  palette = structuredClone(S.defaults.palette);
  $('center').value = S.defaults.center; $('merge').checked = S.defaults.mergeSameColor;
  $('mergeTol').value = S.defaults.vpype.mergeTolerance; $('simpTol').value = S.defaults.vpype.simplifyTolerance; $('minLen').value = S.defaults.vpype.minLength;
  await Promise.all(S.pieces.map(async p => { svgs[p.slug] = await (await fetch(`/api/preview/${p.slug}.svg`)).text(); checked.add(p.slug); }));
  cur = S.pieces[0].slug; drawList(); drawPalettes(); drawPiece();
  $('hdr').textContent = `${S.pieces.length} pieces · files only, nothing is sent to a plotter`;
}
/** Recolor by layer order: pen i (1-based layer number) takes palette ink i-1; the border takes its pen's ink. */
function colored(slug) {
  const piece = S.pieces.find(p => p.slug === slug);
  const borderPen = piece.pens.findIndex(p => p.id === S.borderPen);
  return svgs[slug].replace(/(<g\b[^>]*inkscape:label="(\d+)-([^"]*)"[^>]*\bstroke=")([^"]*)(")/g, (m, a, n, name, _c, z) => {
    const i = name === 'finishing-border' ? Math.max(0, borderPen) : Number(n) - 1;
    return a + palette.inks[i % palette.inks.length] + z;
  }).replace(/<svg\b([^>]*)>/, `<svg$1 style="background:${palette.paper}">`);
}
function drawList() {
  $('list').replaceChildren(...S.pieces.map(p => {
    const b = document.createElement('div'); b.className = 'piece' + (p.slug === cur ? ' on' : '');
    b.innerHTML = `${colored(p.slug)}<small>${esc(p.title || p.name)} · s${p.seed}</small><label><input type="checkbox" ${checked.has(p.slug) ? 'checked' : ''}> include</label>`;
    b.onclick = e => { if (e.target.tagName === 'INPUT') return; cur = p.slug; drawList(); drawPiece(); };
    b.querySelector('input').onchange = e => { e.target.checked ? checked.add(p.slug) : checked.delete(p.slug); $('all').textContent = `Finalize checked pieces (${checked.size})`; };
    return b;
  }));
  $('all').textContent = `Finalize checked pieces (${checked.size})`;
}
function drawPalettes() {
  $('palettes').replaceChildren(...S.palettes.map(p => {
    const b = document.createElement('button'); b.className = 'pal' + (p.id === palette.id ? ' on' : '');
    b.innerHTML = `<span class="sw"><i style="background:${p.paper}"></i>${p.inks.slice(0, 5).map(c => `<i style="background:${c}"></i>`).join('')}</span><b>${esc(p.label)}</b><span>${esc(p.note || '')}</span>`;
    b.onclick = () => { palette = structuredClone(p); drawPalettes(); drawPiece(); drawList(); };
    return b;
  }));
}
function drawPiece() {
  $('sheet').innerHTML = colored(cur);
  const piece = S.pieces.find(p => p.slug === cur);
  $('layers').replaceChildren(...piece.pens.map((pen, i) => {
    const row = document.createElement('div'); row.className = 'layer';
    const color = palette.inks[i % palette.inks.length];
    row.innerHTML = `<input type="color" value="${color}"><span>${i + 1} · ${esc(pen.id)}</span><span class="k">${color}</span>`;
    row.querySelector('input').oninput = e => {
      if (!palette.id.endsWith('*')) { palette.id += '*'; palette.label += ' (edited)'; }
      palette.inks[i % palette.inks.length] = e.target.value; row.querySelector('.k').textContent = e.target.value;
      $('sheet').innerHTML = colored(cur); drawList(); drawPalettes();
    };
    return row;
  }));
  $('paper').value = palette.paper; $('paperHex').textContent = palette.paper;
  $('paper').oninput = e => { palette.paper = e.target.value; $('paperHex').textContent = e.target.value; $('sheet').innerHTML = colored(cur); drawList(); };
}
async function finalize(slugs) {
  $('one').disabled = $('all').disabled = true; $('status').textContent = `Rendering and running vpype on ${slugs.length} piece${slugs.length > 1 ? 's' : ''}…`;
  try {
    const body = { pieces: slugs, palette: { ...palette, id: palette.id.replace('*', '-edited') }, center: $('center').value, mergeSameColor: $('merge').checked,
      vpype: { mergeTolerance: +$('mergeTol').value, simplifyTolerance: +$('simpTol').value, minLength: +$('minLen').value } };
    const res = await fetch('/api/finalize', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const out = await res.json(); if (!res.ok) throw new Error(out.error);
    $('status').textContent = `Done: ${out.reports.length} plot-ready file${out.reports.length > 1 ? 's' : ''} written.`;
    $('results').replaceChildren(...out.reports.map(r => {
      const d = document.createElement('div'); d.className = 'result';
      d.innerHTML = `<b>${esc(r.title)} · seed ${r.seed}</b>
        <span class="k" style="font:11px var(--mono)">${r.pens} pen${r.pens > 1 ? 's' : ''} · about ${r.minutes} min · margins ${r.margins ? `${r.margins.top} / ${r.margins.bottom} mm` : 'n/a'} · moved ${r.offset.dy} mm</span>
        <table><tr><th>Layer</th><th>Paths</th><th>Ink m</th><th>Travel m</th><th>Min</th></tr>${r.layers.map(l => `<tr><td><span class="dot" style="background:${l.color}"></span>${esc(l.label)}${l.passes > 1 ? ` ×${l.passes}` : ''}</td><td>${l.paths}</td><td>${(l.drawMm / 1000).toFixed(1)}</td><td>${(l.travelMm / 1000).toFixed(1)}</td><td>${l.minutes.toFixed(1)}</td></tr>`).join('')}</table>
        <span><a href="/out/${r.url.split('/')[2]}/plot-ready.svg" target="_blank">plot-ready.svg</a> · <a href="/out/${r.url.split('/')[2]}/plot-ready.png" target="_blank">preview</a> · <a href="/out/${r.url.split('/')[2]}/report.json" target="_blank">report</a></span>
        <span class="k" style="font:11px var(--mono);word-break:break-all">${esc(r.files.prepared)}</span>`;
      return d;
    }));
  } catch (e) { $('status').textContent = 'Error: ' + e.message; }
  finally { $('one').disabled = $('all').disabled = false; }
}
$('one').onclick = () => finalize([cur]);
$('all').onclick = () => finalize([...checked]);
boot().catch(e => { $('hdr').textContent = 'Failed to load: ' + e.message; });
</script>
</body>
</html>
