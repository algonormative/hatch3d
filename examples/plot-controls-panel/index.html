<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contour family · control panel</title>
  <link rel="stylesheet" href="./node_modules/@hatch3d/plot-core/dist/controls.css">
  <script type="importmap">
    { "imports": { "@hatch3d/plot-core/controls": "./node_modules/@hatch3d/plot-core/dist/controls.js" } }
  </script>
  <style>
    :root { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #24201b; background: #f7f5f2; }
    body { margin: 0; padding: clamp(1rem, 3vw, 2rem); }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 300px); gap: 2rem; max-width: 1080px; margin: auto; }
    h1 { font-size: 1.4rem; font-weight: 600; }
    #art { width: 100%; background: #fffdf9; box-shadow: 0 1px 12px #24201b20; }
    button { font: inherit; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <section><h1>Contour family</h1><p id="status">Current study</p><svg id="art" viewBox="0 0 300 300" role="img" aria-label="Contour family drawing"></svg></section>
    <aside aria-label="Contour controls">
      <button id="reset" type="button">Reset controls</button>
      <div id="navigators"></div>
      <div id="controls"></div>
    </aside>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
